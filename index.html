const pages=[
{icon:"👋",title:"Willkommen bei Herrn Müller",intro:"<strong>Ein Morgen bei Herrn Müller</strong><p>Herr Müller ist 82 Jahre alt und lebt seit einigen Monaten in einer stationären Pflegeeinrichtung. Grundsätzlich kann er sich selbstständig bewegen. Für längere Strecken benötigt er jedoch einen Rollator. Bei der Körperpflege braucht er gelegentlich Unterstützung. Besonders wichtig ist ihm, möglichst viele Dinge weiterhin allein zu erledigen.</p><p>Eines Morgens wacht Herr Müller auf und möchte zur Toilette gehen. Er setzt sich auf die Bettkante und steht anschließend auf. Dabei wird ihm kurz schwindelig. Er hält sich am Bett fest und wartet einen Moment, bis er sich wieder sicherer fühlt. Dann beschließt er, ohne Hilfe ins Badezimmer zu gehen.</p><p>Im Zimmer ist es noch etwas dunkel. Herr Müller trägt bequeme, aber lockere Hausschuhe. Sein Rollator steht einige Meter entfernt neben der Tür. Auf dem Boden liegt ein Verlängerungskabel, das quer durch einen Teil des Zimmers verläuft. Vor dem Badezimmer befindet sich ein kleiner, nicht befestigter Teppich.</p><p>Herr Müller geht langsam in Richtung Badezimmer. Als er den Teppich betritt, bleibt sein Hausschuh an der hochstehenden Teppichkante hängen. Er stolpert nach vorne und verliert das Gleichgewicht. Im letzten Moment gelingt es ihm, sich an der Wand abzustützen. So kann er einen Sturz verhindern.</p><p>Die Pflegefachhelferin Mia ist gerade auf dem Flur unterwegs und bemerkt die Situation. Sie kommt sofort zu Herrn Müller. <em>„Herr Müller, ist alles in Ordnung? Haben Sie sich verletzt?“</em>, fragt sie besorgt.</p><p><em>„Nein, zum Glück nicht. Aber ich habe mich ganz schön erschrocken. Mir war vorhin beim Aufstehen schon etwas schwindelig. Ich wollte doch nur schnell zur Toilette. Ich möchte nicht wegen jeder Kleinigkeit Hilfe brauchen“</em>, antwortet Herr Müller.</p><p>Mia unterstützt ihn dabei, sich zunächst sicher hinzusetzen. Anschließend informiert sie die zuständige Pflegefachkraft über den Schwindel und den Beinahe-Sturz. Gemeinsam mit Herrn Müller bespricht sie, welche Gefahren in seinem Zimmer bestehen und wie diese beseitigt werden können. Dabei möchte sie seine Selbstständigkeit so weit wie möglich erhalten.</p><p>Herr Müller schaut sich nachdenklich um: <em>„Ich hätte gar nicht gedacht, dass so viele Dinge in meinem Zimmer gefährlich sein können. Was kann ich denn selbst tun, damit mir das nicht noch einmal passiert?“</em></p>",type:"intro"},
{icon:"⚠️",title:"Lerninsel 1 · Sturz oder Beinahe-Sturz?",intro:"Herr Müller steht auf, ihm wird schwindelig. Er bleibt an einer Teppichkante hängen, kann sich aber gerade noch an der Wand abstützen.",type:"single",question:"Wie wird dieses Ereignis bezeichnet?",options:["Sturz","Beinahe-Sturz","Bewusstes Hinsetzen"],correct:1,explain:"Herr Müller erreicht den Boden nicht. Weil er sich abfangen kann, ist es ein Beinahe-Sturz."},
{icon:"🔎",title:"Lerninsel 2 · Gefahren-Detektive",intro:"Sehen Sie sich Herrn Müllers Zimmer gedanklich an: Es ist noch dunkel, der Rollator steht weit entfernt, auf dem Boden liegen ein Kabel und ein loser Teppich. Er trägt lockere Hausschuhe.",type:"multi",question:"Wählen Sie alle fünf Gefahren aus der Handlungssituation.",options:["Dunkles Zimmer","Loser Teppich","Verlängerungskabel","Lockere Hausschuhe","Rollator außer Reichweite","Gut befestigter Handlauf","Rutschfeste Schuhe"],correct:[0,1,2,3,4],explain:"Die fünf genannten Bedingungen können die Sicherheit beim Gehen beeinträchtigen."},
{icon:"🧩",title:"Lerninsel 3 · Risiken zuordnen",intro:"Sturzrisiken können personenbezogen, medikamentenbezogen oder umgebungsbezogen sein. Über Herrn Müllers Medikamente liegen keine Angaben vor.",type:"match",question:"Ordnen Sie nacheinander die folgenden Merkmale zu.",items:[["Schwindel beim Aufstehen",0],["Loser Teppich",1],["Unbekannte Medikamenteneinnahme",2],["Eingeschränkte Mobilität bei längeren Strecken",0],["Schlechte Beleuchtung",1]],categories:["Personenbezogen","Umgebungsbezogen","Nicht beurteilbar"],explain:"Bei Medikamenten ist ohne Anamnese oder Akteneinsicht keine Aussage möglich."},
{icon:"💭",title:"Lerninsel 4 · Was passiert nach einem Sturz?",intro:"Alternative Fortsetzung der Geschichte: Herr Müller kann sich nicht abstützen, stürzt und klagt über Schmerzen in der rechten Hüfte.",type:"single",question:"Welche mögliche Folge beschreibt den Teufelskreis der Sturzangst am besten?",options:["Angst → weniger Bewegung → Muskelabbau → steigendes Sturzrisiko","Angst → automatisch bessere Balance → sinkendes Risiko","Angst → mehr Muskelkraft ohne Training"],correct:0,explain:"Sturzangst kann zur Vermeidung von Bewegung führen. Das kann Kraft und Sicherheit zusätzlich verringern."},
{icon:"📝",title:"Lerninsel 5 · Beobachten und dokumentieren",intro:"Mia findet Herrn Müller nach dem Sturz auf dem Boden. Er berichtet über Schmerzen an der rechten Hüfte. Mia sorgt für Sicherheit und informiert die zuständige Pflegefachkraft.",type:"multi",question:"Welche Informationen gehören in eine sachliche Sturzdokumentation?",options:["Zeitpunkt und Ort","Beobachtete Umstände","Beschwerden und sichtbare Verletzungen","Eingeleitete Maßnahmen und informierte Personen","Eine unbewiesene Schuldzuweisung"],correct:[0,1,2,3],explain:"Eine Dokumentation beschreibt beobachtbare Fakten und Maßnahmen, keine unbelegten Bewertungen."},
{icon:"🛠️",title:"Lerninsel 6 · Sicherheit gestalten",intro:"Herr Müller möchte selbstständig zur Toilette gehen. Die Maßnahmen sollen seine Sicherheit fördern, ohne Selbstständigkeit unnötig einzuschränken.",type:"multi",question:"Welche Maßnahmen passen zu Herrn Müllers Situation?",options:["Kabel und Teppich als Stolperfallen beseitigen","Für ausreichende Beleuchtung sorgen","Rollator gut erreichbar platzieren","Auf geeignetes Schuhwerk achten","Herrn Müller grundsätzlich nicht mehr aufstehen lassen"],correct:[0,1,2,3],explain:"Die Umgebung wird sicherer gestaltet und die Mobilität möglichst erhalten."},
{icon:"📋",title:"Lerninsel 7 · Expertenstandard in der Praxis",intro:"Der DNQP-Expertenstandard zur Sturzprophylaxe beschreibt einen strukturierten Pflegeprozess. Pflegefachhelfende unterstützen insbesondere durch Beobachtung, Weitergabe und Durchführung vereinbarter Maßnahmen.",type:"order",question:"Bringen Sie die sechs Schritte in eine sinnvolle Reihenfolge.",items:["Risiko einschätzen","Maßnahmen planen","Informieren und beraten","Maßnahmen durchführen","Ergebnisse überprüfen","Sturzrisiken und Veränderungen erkennen"],correct:[5,0,1,2,3,4],explain:"Erkennen → Einschätzen → Planen → Informieren → Durchführen → Überprüfen. Die Schritte greifen im Pflegealltag ineinander."}
,{icon:"🧠",title:"Lerninsel 8 · Risiken verstehen",intro:"Mehrere Faktoren können zusammenwirken: Schwindel, Bewegungsunsicherheit, Sehprobleme, ungeeignetes Schuhwerk oder möglicherweise bestimmte Medikamente. Bei Herrn Müller ist die Medikamenteneinnahme nicht bekannt.",type:"multi",question:"Welche Aussagen sind fachlich richtig?",options:["Schwindel beim Aufstehen sollte weitergegeben werden","Medikamente können das Sturzrisiko beeinflussen","Selbstständigkeit muss grundsätzlich verboten werden","Sehprobleme und schlechte Beleuchtung erhöhen möglicherweise das Risiko","Ein Rollator muss außer Reichweite stehen"],correct:[0,1,3],explain:"Sturzprophylaxe betrachtet individuelle Risiken und die Umgebung. Die Selbstständigkeit soll unterstützt werden."},
{icon:"🦴",title:"Lerninsel 9 · Sturzfolgen und Hilfsmittel",intro:"Stürze können Prellungen, Knochenbrüche, Schmerzen und Sturzangst auslösen. Hilfsmittel können Risiken oder Folgen vermindern. Sehen Sie sich die Abbildungen zu Rollator, Schuhwerk und Hüftprotektoren an.",type:"single",question:"Welche Aussage zu Hüftprotektoren ist richtig?",options:["Sie verhindern jeden Sturz","Sie können bei geeigneten Personen das Risiko bestimmter Hüftverletzungen beim Sturz vermindern","Sie ersetzen die individuelle Risikoeinschätzung"],correct:1,explain:"Hüftprotektoren sollen mögliche Sturzfolgen vermindern, nicht Stürze selbst verhindern."},
{icon:"🤝",title:"Lerninsel 10 · Sicher handeln und beraten",intro:"Herr Müller sagt: „Ich möchte nachts niemanden stören. Ich gehe lieber allein.“ Mia möchte seine Selbstbestimmung respektieren und die Sicherheit verbessern. Bei einem tatsächlichen Sturz mit Hüftschmerzen muss die Pflegefachkraft sofort informiert werden; Herr Müller wird nicht unüberlegt aufgerichtet.",type:"single",question:"Welche Antwort von Mia passt am besten?",options:["„Dann dürfen Sie Ihr Bett nicht mehr verlassen.“","„Sie entscheiden allein; Risiken spielen keine Rolle.“","„Wir überlegen gemeinsam, wie Sie nachts sicher zur Toilette kommen und wann Sie Hilfe anfordern können.“"],correct:2,explain:"Beratung erfolgt respektvoll, verständlich und gemeinsam mit Herrn Müller."},
];

let step=0,done=0,selection=[],matchIndex=0,order=[],quizAnswers={};const $=id=>document.getElementById(id);function save(){try{sessionStorage.setItem("sturzStep",JSON.stringify({step,done}))}catch(e){}}function render(){step=Math.min(step,done+1);$("status").textContent=step===0?"Willkommen":step===11?"Abschlussquiz":"Lerninsel "+step;$("count").textContent=done+" von 10 Lerninseln abgeschlossen";$("fill").style.width=(done/10*100)+"%";$("dots").innerHTML=Array.from({length:10},(_,i)=>'<span class="dot '+(i<done?"done":step===i+1?"current":"")+'">'+(i<done?"✓ ":"")+ (i+1)+'</span>').join("");selection=[];matchIndex=0;order=[];if(step===11){renderQuiz();return}let p=pages[step];let s='<section class="card page"><div class="hero"><div><div style="font-size:36px">'+p.icon+'</div><h2>'+p.title+'</h2><p>'+p.intro+'</p></div><div class="scene"><span class="rug"></span><span class="cable">🔌</span><span class="person">👴</span><span class="roll">🦯</span><span class="lamp">💡</span></div></div>';if(step===0){s+='<div class="task"><strong>So funktioniert Ihre Lernreise:</strong><p>Arbeiten Sie allein. Auf jeder Seite lösen Sie eine Aufgabe. Sie erhalten sofort Rückmeldung. Nach zehn Lerninseln wird das Abschlussquiz freigeschaltet. Erstellen Sie am Ende einen Screenshot Ihres Ergebnisses und senden Sie ihn Ihrer Lehrkraft per E-Mail.</p></div><button class="btn" onclick="go(1)">Mission starten →</button>'}else{if(step===0)s+="<div class=\"media\"><h3>🎬 Film: Herr Müller im Pflegealltag</h3><video controls playsinline preload=\"metadata\" style=\"width:100%;border-radius:12px\"><source src=\"Herr%20M%C3%BCller%20ist%2082%20Jahre%20alt%2C%20lebt%20in%20einer%20Pflegeeinrichtung%20und%20benutzt%20einen%20Rollator..mp4\" type=\"video/mp4\">Ihr Browser unterstützt dieses Video nicht.</video><p class=\"muted\">Sehen Sie sich das Video an und achten Sie auf mögliche Sturzgefahren.</p></div>";if(step===2)s+="<div class=\"media-grid\"><figure class=\"media\"><img loading=\"lazy\" src=\"rollator.png\" alt=\"Rollator als Gehhilfe\"><figcaption>Rollator als Gehhilfe</figcaption></figure><figure class=\"media\"><img loading=\"lazy\" src=\"rollen%20fest.png\" alt=\"Rollen und Bremsen\"><figcaption>Rollen und Bremsen</figcaption></figure><figure class=\"media\"><img loading=\"lazy\" src=\"socken%20.png\" alt=\"Schuhwerk und Rutschhemmung\"><figcaption>Schuhwerk und Rutschhemmung</figcaption></figure></div>";if(step===4)s+="<div class=\"media-grid\"><figure class=\"media\"><img loading=\"lazy\" src=\"Unf%C3%A4lle%20durch%20St%C3%BCrze.png\" alt=\"Unfälle durch Stürze – bereitgestellte Abbildung\"><figcaption>Unfälle durch Stürze – bereitgestellte Abbildung</figcaption></figure><figure class=\"media\"><img loading=\"lazy\" src=\"Unf%C3%A4lle%20%C3%BCbersicht.png\" alt=\"Übersicht zu Unfällen – bereitgestellte Abbildung\"><figcaption>Übersicht zu Unfällen – bereitgestellte Abbildung</figcaption></figure></div>";if(step===7)s+="<figure class=\"media\"><img loading=\"lazy\" src=\"Expertenstandard.png\" alt=\"Expertenstandard Sturzprophylaxe – bereitgestellte Übersicht\"><figcaption>Expertenstandard Sturzprophylaxe – bereitgestellte Übersicht</figcaption></figure>";if(step===9)s+="<div class=\"media-grid\"><figure class=\"media\"><img loading=\"lazy\" src=\"h%C3%BCftprot.png\" alt=\"Hüftprotektoren\"><figcaption>Hüftprotektoren</figcaption></figure><figure class=\"media\"><img loading=\"lazy\" src=\"25.png\" alt=\"Zusätzliche Unterrichtsabbildung\"><figcaption>Zusätzliche Unterrichtsabbildung</figcaption></figure></div>";s+='<div class="task"><strong>Ihre Aufgabe:</strong> '+p.question+'</div><div id="activity"></div><div id="feedback" aria-live="polite"></div><div class="nav"><button class="btn ghost" onclick="go('+(step-1)+')">← Zurück</button><button class="btn" id="next" disabled onclick="advance()">Weiter →</button></div>'}s+='</section>';$("page").innerHTML=s;if(step>0)drawActivity(p)}
function go(n){if(n===11&&done!==10)return;step=n;render();save();window.scrollTo({top:0,behavior:"smooth"})}
function drawActivity(p){let a=$("activity");if(p.type==="single"||p.type==="multi"){a.innerHTML=p.options.map((v,i)=>'<button class="choice" id="c'+i+'" onclick="choose('+i+')">'+(p.type==="multi"?"☐ ":"")+v+'</button>').join("")+'<button class="btn ghost" onclick="check()">Antwort prüfen</button>'}if(p.type==="match"){a.innerHTML='<div id="matchPrompt"></div><div class="grid">'+p.categories.map((x,i)=>'<button class="tile" onclick="match('+i+')">'+x+'</button>').join("")+'</div>';drawMatch(p)}if(p.type==="order"){a.innerHTML='<p>Tippen Sie die Schritte in der richtigen Reihenfolge an.</p><div id="ordered" class="task">Ihre Reihenfolge: –</div><div class="grid">'+p.items.map((x,i)=>'<button class="tile" id="o'+i+'" onclick="pickOrder('+i+')">'+x+'</button>').join("")+'</div><button class="btn ghost" onclick="order=[];drawActivity(p)">Zurücksetzen</button><button class="btn ghost" onclick="check()">Reihenfolge prüfen</button>'}}
function choose(i){let p=pages[step];if(p.type==="single")selection=[i];else selection=selection.includes(i)?selection.filter(x=>x!==i):[...selection,i];p.options.forEach((_,j)=>$("c"+j).classList.toggle("selected",selection.includes(j)))}
function match(i){let p=pages[step];if(i===p.items[matchIndex][1]){matchIndex++;if(matchIndex===p.items.length){success(p.explain);return}drawMatch(p)}else feedback("Versuchen Sie es noch einmal. Überlegen Sie, woher dieser Risikofaktor stammt.",false)}
function drawMatch(p){$("matchPrompt").innerHTML='<p><strong>Merkmal '+(matchIndex+1)+' von '+p.items.length+':</strong> '+p.items[matchIndex][0]+'</p>'}
function pickOrder(i){if(order.includes(i))return;order.push(i);$("o"+i).classList.add("active");$("ordered").textContent="Ihre Reihenfolge: "+order.map((j,k)=>(k+1)+". "+pages[step].items[j]).join(" → ")}
function check(){let p=pages[step];let correct=p.type==="single"?selection.length===1&&selection[0]===p.correct:p.type==="multi"?selection.length===p.correct.length&&p.correct.every(x=>selection.includes(x)):p.type==="order"?order.length===6&&p.correct.every((x,i)=>order[i]===x):false;if(correct)success(p.explain);else feedback("Noch nicht ganz richtig. Überprüfen Sie Ihre Auswahl und versuchen Sie es erneut.",false)}
function feedback(t,ok){$("feedback").innerHTML='<div class="feedback '+(ok?"":"bad")+'">'+(ok?"✓ ":"↻ ")+t+'</div>'}
function success(t){feedback(t,true);$("next").disabled=false;$("activity").querySelectorAll("button").forEach(b=>b.disabled=true)}
function advance(){done=Math.max(done,step);go(step===10?11:step+1)}
function renderQuiz(){if(done!==10)return;$("page").innerHTML='<section class="card page"><h2>🏁 Abschlussquiz: Ihre Mission</h2><p>Beantworten Sie alle zehn Multiple-Choice-Fragen. Pro Frage ist genau eine Antwort richtig.</p><div id="quiz"></div><button class="btn" onclick="finish()">Ergebnis auswerten</button><div id="certificate"></div></section>';$("certificate").style.display="none";$("quiz").innerHTML=questions.map((q,i)=>'<div class="quizq"><strong>'+(i+1)+'. '+q[0]+'</strong>'+q[1].map((v,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+v+'</label>').join("")+'</div>').join("")}
function finish(){let score=0;for(let i=0;i<questions.length;i++){let a=document.querySelector('input[name="q'+i+'"]:checked');if(!a){alert("Bitte beantworten Sie alle zehn Fragen.");return}if(Number(a.value)===questions[i][2])score++}let c=$("certificate");c.style.display="block";c.innerHTML='<h2>🎉 Ihre Lernreise ist abgeschlossen!</h2><p style="font-size:26px"><strong>'+score+' von 10 Punkten</strong></p><p>Sie haben alle zehn Lerninseln bearbeitet.</p><p><strong>Wichtig:</strong> Machen Sie jetzt einen Screenshot dieses Ergebnisses und senden Sie ihn Ihrer Lehrkraft per E-Mail.</p><button class="btn ghost" onclick="window.print()">Ergebnis drucken</button>';document.querySelectorAll("#quiz input").forEach(x=>x.disabled=true);document.querySelector("#page>.card>.btn").disabled=true;c.scrollIntoView({behavior:"smooth"})}
render();
</script></body></html>
