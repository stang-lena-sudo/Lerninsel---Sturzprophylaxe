{icon:"👋",title:"Willkommen bei Herrn Müller",intro:"<strong>Ein Morgen bei Herrn Müller</strong><p>Herr Müller ist 82 Jahre alt und lebt seit einigen Monaten in einer stationären Pflegeeinrichtung. Grundsätzlich kann er sich selbstständig bewegen. Für längere Strecken benötigt er jedoch einen Rollator. Bei der Körperpflege braucht er gelegentlich Unterstützung. Besonders wichtig ist ihm, möglichst viele Dinge weiterhin allein zu erledigen.</p><p>Eines Morgens wacht Herr Müller auf und möchte zur Toilette gehen. Er setzt sich auf die Bettkante und steht anschließend auf. Dabei wird ihm kurz schwindelig. Er hält sich am Bett fest und wartet einen Moment, bis er sich wieder sicherer fühlt. Dann beschließt er, ohne Hilfe ins Badezimmer zu gehen.</p><p>Im Zimmer ist es noch etwas dunkel. Herr Müller trägt bequeme, aber lockere Hausschuhe. Sein Rollator steht einige Meter entfernt neben der Tür. Auf dem Boden liegt ein Verlängerungskabel, das quer durch einen Teil des Zimmers verläuft. Vor dem Badezimmer befindet sich ein kleiner, nicht befestigter Teppich.</p><p>Herr Müller geht langsam in Richtung Badezimmer. Als er den Teppich betritt, bleibt sein Hausschuh an der hochstehenden Teppichkante hängen. Er stolpert nach vorne und verliert das Gleichgewicht. Im letzten Moment gelingt es ihm, sich an der Wand abzustützen. So kann er einen Sturz verhindern.</p><p>Die Pflegefachhelferin Mia ist gerade auf dem Flur unterwegs und bemerkt die Situation. Sie kommt sofort zu Herrn Müller. <em>„Herr Müller, ist alles in Ordnung? Haben Sie sich verletzt?“</em>, fragt sie besorgt.</p><p><em>„Nein, zum Glück nicht. Aber ich habe mich ganz schön erschrocken. Mir war vorhin beim Aufstehen schon etwas schwindelig. Ich wollte doch nur schnell zur Toilette. Ich möchte nicht wegen jeder Kleinigkeit Hilfe brauchen“</em>, antwortet Herr Müller.</p><p>Mia unterstützt ihn dabei, sich zunächst sicher hinzusetzen. Anschließend informiert sie die zuständige Pflegefachkraft über den Schwindel und den Beinahe-Sturz. Gemeinsam mit Herrn Müller bespricht sie, welche Gefahren in seinem Zimmer bestehen und wie diese beseitigt werden können. Dabei möchte sie seine Selbstständigkeit so weit wie möglich erhalten.</p><p>Herr Müller schaut sich nachdenklich um: <em>„Ich hätte gar nicht gedacht, dass so viele Dinge in meinem Zimmer gefährlich sein können. Was kann ich denn selbst tun, damit mir das nicht noch einmal passiert?“</em></p>",type:"intro"},
{icon:"⚠️",title:"Lerninsel 1 · Sturz oder Beinahe-Sturz?",intro:"Herr Müller steht auf, ihm wird schwindelig. Er bleibt an einer Teppichkante hängen, kann sich aber gerade noch an der Wand abstützen.",type:"single",question:"Wie wird dieses Ereignis bezeichnet?",options:["Sturz","Beinahe-Sturz","Bewusstes Hinsetzen"],correct:1,explain:"Herr Müller erreicht den Boden nicht. Weil er sich abfangen kann, ist es ein Beinahe-Sturz."},
{"icon":"🔎","title":"Lerninsel 2 · Suchbild: Gefahren-Detektive","intro":"Schauen Sie sich das gezeichnete Pflegezimmer genau an. Wie im Suchbild auf Seite 4 des Skripts sind acht umgebungsbezogene Sturzgefahren versteckt. Klicken Sie direkt auf die Gegenstände im Bild.","type":"searchpicture","question":"Finden Sie alle acht Sturzgefahren. Nach jedem Treffer erfahren Sie eine passende Maßnahme."},
{icon:"🧩",title:"Lerninsel 3 · Risiken zuordnen",intro:"Sturzrisiken können personenbezogen, medikamentenbezogen oder umgebungsbezogen sein. Über Herrn Müllers Medikamente liegen keine Angaben vor.",type:"match",question:"Ordnen Sie nacheinander die folgenden Merkmale zu.",items:[["Schwindel beim Aufstehen",0],["Loser Teppich",1],["Unbekannte Medikamenteneinnahme",2],["Eingeschränkte Mobilität bei längeren Strecken",0],["Schlechte Beleuchtung",1]],categories:["Personenbezogen","Umgebungsbezogen","Nicht beurteilbar"],explain:"Bei Medikamenten ist ohne Anamnese oder Akteneinsicht keine Aussage möglich."},

function setCloze(i,value){clozeValues[i]=value;const select=document.getElementById("blank"+i);if(select)select.value=value}
function checkCloze(){const p=pages[step];if(p.blanks.every((b,i)=>clozeValues[i]===b[2]))success(p.explain);else feedback("Noch nicht alle Begriffe passen. Lesen Sie die Sätze erneut und korrigieren Sie Ihre Auswahl.",false)}
function choose(i){let p=pages[step];if(p.type==="single")selection=[i];else selection=selection.includes(i)?selection.filter(x=>x!==i):[...selection,i];p.options.forEach((_,j)=>$("c"+j).classList.toggle("selected",selection.includes(j)))}
function match(i){let p=pages[step];if(i===p.items[matchIndex][1]){matchIndex++;if(matchIndex===p.items.length){success(p.explain);return}drawMatch(p)}else feedback("Versuchen Sie es noch einmal. Überlegen Sie, woher dieser Risikofaktor stammt.",false)}
function drawMatch(p){$("matchPrompt").innerHTML='<p><strong>Merkmal '+(matchIndex+1)+' von '+p.items.length+':</strong> '+p.items[matchIndex][0]+'</p>'}
function pickOrder(i){if(order.includes(i))return;order.push(i);$("o"+i).classList.add("active");$("ordered").textContent="Ihre Reihenfolge: "+order.map((j,k)=>(k+1)+". "+pages[step].items[j]).join(" → ")}
function check(){let p=pages[step];let correct=p.type==="single"?selection.length===1&&selection[0]===p.correct:p.type==="multi"?selection.length===p.correct.length&&p.correct.every(x=>selection.includes(x)):p.type==="order"?order.length===6&&p.correct.every((x,i)=>order[i]===x):false;if(correct)success(p.explain);else feedback("Noch nicht ganz richtig. Überprüfen Sie Ihre Auswahl und versuchen Sie es erneut.",false)}
function feedback(t,ok){$("feedback").innerHTML='<div class="feedback '+(ok?"":"bad")+'">'+(ok?"✓ ":"↻ ")+t+'</div>'}
function success(t){feedback(t,true);$("next").disabled=false;$("activity").querySelectorAll("button").forEach(b=>b.disabled=true)}
function advance(){done=Math.max(done,step);go(step===21?22:step+1)}
function renderQuiz(){if(done!==21)return;$("page").innerHTML='<section class="card page"><h2>🏁 Abschlussquiz: Ihre Mission</h2><p>Beantworten Sie alle 18 Multiple-Choice-Fragen. Pro Frage ist genau eine Antwort richtig.</p><div id="quiz"></div><button class="btn" onclick="finish()">Ergebnis auswerten</button><div id="certificate"></div></section>';$("certificate").style.display="none";$("quiz").innerHTML=questions.map((q,i)=>'<div class="quizq"><strong>'+(i+1)+'. '+q[0]+'</strong>'+q[1].map((v,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+v+'</label>').join("")+'</div>').join("")}
function finish(){
let score=0,review=[];
for(let i=0;i<questions.length;i++){
 const a=document.querySelector('input[name="q'+i+'"]:checked');
 if(!a){alert("Bitte beantworten Sie alle 18 Fragen.");return}
 const chosen=Number(a.value),correct=questions[i][2],ok=chosen===correct;
 if(ok)score++;
 review.push('<div class="review-item '+(ok?'review-right':'review-wrong')+'"><strong>'+(i+1)+'. '+questions[i][0]+'</strong><p>'+(ok?'✓ Richtig beantwortet':'✗ Noch nicht richtig')+'</p><p><strong>Ihre Antwort:</strong> '+questions[i][1][chosen]+'</p><p><strong>Richtige Lösung:</strong> '+questions[i][1][correct]+'</p></div>');
}
let c=$("certificate");c.style.display="block";
c.innerHTML='<div id="completion-sheet" class="completion-sheet"><div class="completion-kicker">PFLEGEFACHHILFE · LERNINSEL STURZPROPHYLAXE</div><div class="completion-medal" aria-hidden="true">🏆</div><h2>Gut gemacht!</h2><p>Sie haben die Mission „Sicher unterwegs“ mit Herrn Müller abgeschlossen.</p><div class="completion-name"><label for="learner-name">Vor- und Nachname</label><input id="learner-name" type="text" autocomplete="name" placeholder="Bitte hier Ihren Namen eintragen"></div><div class="completion-stats"><div><strong>21 / 21</strong><span>Lerninseln bearbeitet</span></div><div><strong>'+score+' / '+questions.length+'</strong><span>Punkte im Abschlussquiz</span></div></div><p class="completion-date">Abgeschlossen am '+new Date().toLocaleDateString("de-DE")+'</p><p class="completion-message">Vielen Dank für Ihre Mitarbeit!</p></div><div class="task"><strong>Ihr letzter Arbeitsauftrag:</strong><p>Tragen Sie Ihren Vor- und Nachnamen in den Abschlussbogen ein. Erstellen Sie einen Screenshot des vollständigen Bogens und senden Sie diesen per E-Mail an Ihre Lehrkraft.</p><button class="btn ghost" onclick="document.getElementById(\'completion-sheet\').scrollIntoView({block:\'start\',behavior:\'smooth\'})">Abschlussbogen anzeigen ↑</button></div><div class="review-list"><h3>Auswertung und Musterlösungen</h3><p>Vergleichen Sie Ihre Antworten mit den richtigen Lösungen.</p>'+review.join('')+'</div>';

document.querySelectorAll("#quiz input").forEach(x=>x.disabled=true);
document.querySelector("#page>.card>.btn").disabled=true;
c.scrollIntoView({behavior:"smooth"});
}
let practiceDone=[],practicePick=null,practiceIndex=0;
function startPractice(p){practiceDone=[];practicePick=null;practiceIndex=0;const a=$("activity");if(p.type==="roomfix"){a.innerHTML='<div class="practice-room">'+p.hazards.map((v,i)=>'<button class="room-object" id="haz'+i+'" onclick="fixHazard('+i+')"><span>'+v[0]+'</span><strong>'+v[1]+'</strong></button>').join("")+'</div><p id="practiceCount">0 von 10 Mängeln behoben</p>'}else if(p.type==="pairs"){const perm=[4,8,1,6,9,0,3,7,2,5];a.innerHTML='<div class="pair-grid"><div><h3>Hilfsmittel</h3>'+p.pairs.map((v,i)=>'<button class="choice" id="left'+i+'" onclick="pickPair('+i+')">'+v[0]+'</button>').join("")+'</div><div><h3>Funktion</h3>'+perm.map(i=>'<button class="choice" id="right'+i+'" onclick="solvePair('+i+')">'+p.pairs[i][1]+'</button>').join("")+'</div></div><p id="practiceCount">0 von 10 Paaren</p>'}else drawCase()}
function fixHazard(i){const p=pages[step],v=p.hazards[i];if(!v[2]){feedback("Dieser Bereich ist bereits sicher.",false);return}if(practiceDone.includes(i))return;practiceDone.push(i);const b=$("haz"+i);b.classList.add("fixed");b.innerHTML='<span>✓</span><strong>'+v[2]+'</strong>';b.disabled=true;$("practiceCount").textContent=practiceDone.length+" von 10 Mängeln behoben";if(practiceDone.length===10)success(p.explain);else feedback(v[2],true)}
function pickPair(i){practicePick=i;pages[step].pairs.forEach((_,j)=>$("left"+j).classList.toggle("selected",j===i))}
function solvePair(i){if(practicePick!==i){feedback("Wählen Sie das passende Hilfsmittel und seine Funktion.",false);return}practiceDone.push(i);for(const id of ["left"+i,"right"+i]){$(id).classList.add("fixed");$(id).disabled=true}practicePick=null;$("practiceCount").textContent=practiceDone.length+" von 10 Paaren";if(practiceDone.length===10)success(pages[step].explain);else feedback("Richtig zugeordnet.",true)}
function drawCase(){const p=pages[step],v=p.cases[practiceIndex];$("activity").innerHTML='<div class="case-dialog"><small>Situation '+(practiceIndex+1)+' von '+p.cases.length+'</small><h3>'+v[0]+'</h3>'+v[1].map((x,i)=>'<button class="choice" onclick="answerCase('+i+')">'+x+'</button>').join("")+'</div>'}
function answerCase(i){const p=pages[step],v=p.cases[practiceIndex];if(i!==v[2]){feedback("Überlegen Sie erneut: Welche Handlung unterstützt Sicherheit und Selbstständigkeit?",false);return}practiceIndex++;if(practiceIndex===p.cases.length)success(p.explain);else{drawCase();feedback("Richtig. Bearbeiten Sie die nächste Situation.",true)}}

function findSpot(i){if(searchFound.includes(i))return;searchFound.push(i);const b=$("spot"+i);b.classList.add("found");b.textContent="✓";b.disabled=true;const t=searchTargets[i];$("searchCount").textContent=searchFound.length+" von 8 Sturzgefahren gefunden";$("searchList").innerHTML=searchFound.map(j=>'<p>✓ <strong>'+searchTargets[j][0]+'</strong> – '+searchTargets[j][5]+'</p>').join("");if(searchFound.length===8)success("Sehr gut! Sie haben alle acht umgebungsbezogenen Sturzgefahren entdeckt.");else feedback(t[0]+": "+t[5],true)}
