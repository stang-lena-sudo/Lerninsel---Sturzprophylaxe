<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sturzprophylaxe | Mission Herr Müller</title><style>
:root{--navy:#17364d;--blue:#256b83;--mint:#d7f3eb;--gold:#ffdc87;--paper:#f4f8fb;--red:#a92c40}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:16px/1.6 system-ui,Segoe UI,sans-serif}header{background:linear-gradient(110deg,#17364d,#287e88);color:white;padding:25px 20px}header .inner,main{max-width:980px;margin:auto}h1{font-size:clamp(1.7rem,4vw,2.7rem);margin:3px 0}h2{line-height:1.25}main{padding:22px 16px 60px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.bar{background:#dbe7eb;border-radius:50px;height:12px;overflow:hidden;margin:12px 0 24px}.bar>div{background:#3c9d87;height:100%;width:0;transition:width .5s}.card{background:white;border-radius:20px;padding:clamp(18px,4vw,32px);box-shadow:0 8px 28px #17364d13;margin-bottom:20px}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}.scene{min-height:210px;background:linear-gradient(#d8ecf4,#eff8f8);border-radius:18px;position:relative;overflow:hidden;display:grid;place-items:center}.person{font-size:100px;animation:bob 3s ease-in-out infinite}.scene .rug{position:absolute;bottom:14px;width:70%;height:20px;background:#d7a278;border-radius:50%;transform:rotate(-4deg)}.scene .cable{position:absolute;bottom:46px;left:8%;font-size:35px}.scene .roll{position:absolute;bottom:38px;right:9%;font-size:52px}.scene .lamp{position:absolute;top:10px;right:20px;font-size:38px;animation:glow 2s infinite alternate}@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes glow{to{filter:drop-shadow(0 0 14px #ffd666)}}@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.page{animation:pop .35s ease}.btn{border:0;border-radius:12px;background:var(--blue);color:white;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;margin:5px 6px 5px 0}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{background:#a7b7bf;cursor:not-allowed}.ghost{background:#e5eff3;color:var(--navy)}.choice{display:block;width:100%;text-align:left;background:#eef5f8;color:var(--navy);border:2px solid transparent;padding:12px 16px;margin:9px 0;border-radius:12px;cursor:pointer;font:inherit}.choice:hover{border-color:#6bb5b0}.choice.selected{border-color:#218c80;background:var(--mint)}.task{background:#f4f9fb;border-left:5px solid #5da7aa;padding:16px;border-radius:10px;margin:18px 0}.feedback{padding:12px 15px;border-radius:12px;margin:15px 0;background:#e9f4ee}.bad{background:#ffe9e9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{padding:15px;border-radius:14px;background:#eaf3f6;text-align:left;cursor:pointer;border:2px solid transparent;font:inherit;color:var(--navy)}.tile.active{background:var(--mint);border-color:#228978}.tile strong{display:block}.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.steps{display:flex;gap:7px;flex-wrap:wrap}.dot{border-radius:20px;background:#dce8ed;padding:5px 10px;font-size:13px}.dot.done{background:#bdebdc}.dot.current{background:var(--gold)}.muted{color:#526a78}textarea{width:100%;min-height:100px;border:2px solid #d5e4ea;border-radius:12px;padding:12px;font:inherit}.quizq{border-bottom:1px solid #dce8ed;padding:14px 0}.quizq label{display:block;padding:5px}input[type=radio]{accent-color:#247e7a}#certificate{background:#f7fbff;border:2px dashed #8cb8be;padding:20px;border-radius:15px}footer{color:#526a78;text-align:center;font-size:13px}@media(max-width:650px){.hero{grid-template-columns:1fr}.scene{min-height:160px}.person{font-size:75px}}
</style></head><body><header><div class="inner"><div>PFLEGEFACHHILFE · INTERAKTIVE EINZELARBEIT</div><h1>🛡️ Mission: Sicher unterwegs</h1><div>Eine Lernreise zur Sturzprophylaxe mit Herrn Müller</div></div></header><main><div class="top"><strong id="status">Start</strong><span id="count">0 von 7 Lerninseln</span></div><div class="bar"><div id="fill"></div></div><div class="steps" id="dots"></div><div id="page"></div><footer>Unterrichtsgrundlage: Arbeitsblatt „Sturzprophylaxe – Ein Morgen bei Herr Müller“ · Ihre Antworten bleiben auf diesem Gerät.</footer></main><script>
const pages=[
{icon:"👋",title:"Willkommen bei Herrn Müller",intro:"Sie begleiten Mia, eine Pflegefachhelferin, durch ihren Frühdienst. Herr Müller ist 82 Jahre alt, lebt in einer Pflegeeinrichtung und möchte möglichst selbstständig bleiben.",type:"intro"},
{icon:"⚠️",title:"Lerninsel 1 · Sturz oder Beinahe-Sturz?",intro:"Herr Müller steht auf, ihm wird schwindelig. Er bleibt an einer Teppichkante hängen, kann sich aber gerade noch an der Wand abstützen.",type:"single",question:"Wie wird dieses Ereignis bezeichnet?",options:["Sturz","Beinahe-Sturz","Bewusstes Hinsetzen"],correct:1,explain:"Herr Müller erreicht den Boden nicht. Weil er sich abfangen kann, ist es ein Beinahe-Sturz."},
{icon:"🔎",title:"Lerninsel 2 · Gefahren-Detektive",intro:"Sehen Sie sich Herrn Müllers Zimmer gedanklich an: Es ist noch dunkel, der Rollator steht weit entfernt, auf dem Boden liegen ein Kabel und ein loser Teppich. Er trägt lockere Hausschuhe.",type:"multi",question:"Wählen Sie alle fünf Gefahren aus der Handlungssituation.",options:["Dunkles Zimmer","Loser Teppich","Verlängerungskabel","Lockere Hausschuhe","Rollator außer Reichweite","Gut befestigter Handlauf","Rutschfeste Schuhe"],correct:[0,1,2,3,4],explain:"Die fünf genannten Bedingungen können die Sicherheit beim Gehen beeinträchtigen."},
{icon:"🧩",title:"Lerninsel 3 · Risiken zuordnen",intro:"Sturzrisiken können personenbezogen, medikamentenbezogen oder umgebungsbezogen sein. Über Herrn Müllers Medikamente liegen keine Angaben vor.",type:"match",question:"Ordnen Sie nacheinander die folgenden Merkmale zu.",items:[["Schwindel beim Aufstehen",0],["Loser Teppich",1],["Unbekannte Medikamenteneinnahme",2],["Eingeschränkte Mobilität bei längeren Strecken",0],["Schlechte Beleuchtung",1]],categories:["Personenbezogen","Umgebungsbezogen","Nicht beurteilbar"],explain:"Bei Medikamenten ist ohne Anamnese oder Akteneinsicht keine Aussage möglich."},
{icon:"💭",title:"Lerninsel 4 · Was passiert nach einem Sturz?",intro:"Alternative Fortsetzung der Geschichte: Herr Müller kann sich nicht abstützen, stürzt und klagt über Schmerzen in der rechten Hüfte.",type:"single",question:"Welche mögliche Folge beschreibt den Teufelskreis der Sturzangst am besten?",options:["Angst → weniger Bewegung → Muskelabbau → steigendes Sturzrisiko","Angst → automatisch bessere Balance → sinkendes Risiko","Angst → mehr Muskelkraft ohne Training"],correct:0,explain:"Sturzangst kann zur Vermeidung von Bewegung führen. Das kann Kraft und Sicherheit zusätzlich verringern."},
{icon:"📝",title:"Lerninsel 5 · Beobachten und dokumentieren",intro:"Mia findet Herrn Müller nach dem Sturz auf dem Boden. Er berichtet über Schmerzen an der rechten Hüfte. Mia sorgt für Sicherheit und informiert die zuständige Pflegefachkraft.",type:"multi",question:"Welche Informationen gehören in eine sachliche Sturzdokumentation?",options:["Zeitpunkt und Ort","Beobachtete Umstände","Beschwerden und sichtbare Verletzungen","Eingeleitete Maßnahmen und informierte Personen","Eine unbewiesene Schuldzuweisung"],correct:[0,1,2,3],explain:"Eine Dokumentation beschreibt beobachtbare Fakten und Maßnahmen, keine unbelegten Bewertungen."},
{icon:"🛠️",title:"Lerninsel 6 · Sicherheit gestalten",intro:"Herr Müller möchte selbstständig zur Toilette gehen. Die Maßnahmen sollen seine Sicherheit fördern, ohne Selbstständigkeit unnötig einzuschränken.",type:"multi",question:"Welche Maßnahmen passen zu Herrn Müllers Situation?",options:["Kabel und Teppich als Stolperfallen beseitigen","Für ausreichende Beleuchtung sorgen","Rollator gut erreichbar platzieren","Auf geeignetes Schuhwerk achten","Herrn Müller grundsätzlich nicht mehr aufstehen lassen"],correct:[0,1,2,3],explain:"Die Umgebung wird sicherer gestaltet und die Mobilität möglichst erhalten."},
{icon:"📋",title:"Lerninsel 7 · Expertenstandard in der Praxis",intro:"Der DNQP-Expertenstandard zur Sturzprophylaxe beschreibt einen strukturierten Pflegeprozess. Pflegefachhelfende unterstützen insbesondere durch Beobachtung, Weitergabe und Durchführung vereinbarter Maßnahmen.",type:"order",question:"Bringen Sie die sechs Schritte in eine sinnvolle Reihenfolge.",items:["Risiko einschätzen","Maßnahmen planen","Informieren und beraten","Maßnahmen durchführen","Ergebnisse überprüfen","Sturzrisiken und Veränderungen erkennen"],correct:[5,0,1,2,3,4],explain:"Erkennen → Einschätzen → Planen → Informieren → Durchführen → Überprüfen. Die Schritte greifen im Pflegealltag ineinander."}
];
const questions=[
["Was liegt vor, wenn Herr Müller sich vor dem Fallen abstützen kann?",["Beinahe-Sturz","Sturz","Bewusstes Sitzen"],0],
["Welche Gefahr ist umgebungsbezogen?",["Schwindel","Lose Teppichkante","Hohes Alter"],1],
["Was ist über Herrn Müllers Medikamente bekannt?",["Er nimmt Schlafmittel","Er nimmt Blutdrucksenker","Die Einnahme ist nicht beschrieben"],2],
["Welche körperliche Folge ist nach einem Sturz möglich?",["Knochenbruch","Besseres Gleichgewicht","Muskelzuwachs"],0],
["Was kann Sturzangst begünstigen?",["Mehr Training","Bewegungsvermeidung","Mehr Sicherheit ohne Hilfe"],1],
["Welche Angabe gehört in eine Sturzdokumentation?",["Nur die Zimmernummer","Nur der Name","Zeitpunkt und Maßnahmen"],2],
["Welches Ziel verfolgt Sturzprophylaxe?",["Sichere Mobilität erhalten","Jede Bewegung verhindern","Alle Hilfsmittel entfernen"],0],
["Was hilft in Herrn Müllers Zimmer?",["Dunkelheit beibehalten","Kabel entfernen","Rollator weit wegstellen"],1],
["Was soll Mia bei Schwindel tun?",["Medikamente eigenständig ändern","Schwindel ignorieren","Pflegefachkraft informieren"],2],
["Was gehört zum Expertenstandard?",["Maßnahmen auf Wirksamkeit prüfen","Risiken ignorieren","Nur Stürze zählen"],0]
];
let step=0,done=0,selection=[],matchIndex=0,order=[],quizAnswers={};const $=id=>document.getElementById(id);function save(){try{sessionStorage.setItem("sturzStep",JSON.stringify({step,done}))}catch(e){}}function render(){step=Math.min(step,done+1);$("status").textContent=step===0?"Willkommen":step===8?"Abschlussquiz":"Lerninsel "+step;$("count").textContent=done+" von 7 Lerninseln abgeschlossen";$("fill").style.width=(done/7*100)+"%";$("dots").innerHTML=Array.from({length:7},(_,i)=>'<span class="dot '+(i<done?"done":step===i+1?"current":"")+'">'+(i<done?"✓ ":"")+ (i+1)+'</span>').join("");selection=[];matchIndex=0;order=[];if(step===8){renderQuiz();return}let p=pages[step];let s='<section class="card page"><div class="hero"><div><div style="font-size:36px">'+p.icon+'</div><h2>'+p.title+'</h2><p>'+p.intro+'</p></div><div class="scene"><span class="rug"></span><span class="cable">🔌</span><span class="person">👴</span><span class="roll">🦯</span><span class="lamp">💡</span></div></div>';if(step===0){s+='<div class="task"><strong>So funktioniert Ihre Lernreise:</strong><p>Arbeiten Sie allein. Auf jeder Seite lösen Sie eine Aufgabe. Sie erhalten sofort Rückmeldung. Nach sieben Lerninseln wird das Abschlussquiz freigeschaltet. Erstellen Sie am Ende einen Screenshot Ihres Ergebnisses und senden Sie ihn Ihrer Lehrkraft per E-Mail.</p></div><button class="btn" onclick="go(1)">Mission starten →</button>'}else{s+='<div class="task"><strong>Ihre Aufgabe:</strong> '+p.question+'</div><div id="activity"></div><div id="feedback" aria-live="polite"></div><div class="nav"><button class="btn ghost" onclick="go('+(step-1)+')">← Zurück</button><button class="btn" id="next" disabled onclick="advance()">Weiter →</button></div>'}s+='</section>';$("page").innerHTML=s;if(step>0)drawActivity(p)}
function go(n){if(n===8&&done!==7)return;step=n;render();save();window.scrollTo({top:0,behavior:"smooth"})}
function drawActivity(p){let a=$("activity");if(p.type==="single"||p.type==="multi"){a.innerHTML=p.options.map((v,i)=>'<button class="choice" id="c'+i+'" onclick="choose('+i+')">'+(p.type==="multi"?"☐ ":"")+v+'</button>').join("")+'<button class="btn ghost" onclick="check()">Antwort prüfen</button>'}if(p.type==="match"){a.innerHTML='<div id="matchPrompt"></div><div class="grid">'+p.categories.map((x,i)=>'<button class="tile" onclick="match('+i+')">'+x+'</button>').join("")+'</div>';drawMatch(p)}if(p.type==="order"){a.innerHTML='<p>Tippen Sie die Schritte in der richtigen Reihenfolge an.</p><div id="ordered" class="task">Ihre Reihenfolge: –</div><div class="grid">'+p.items.map((x,i)=>'<button class="tile" id="o'+i+'" onclick="pickOrder('+i+')">'+x+'</button>').join("")+'</div><button class="btn ghost" onclick="order=[];drawActivity(p)">Zurücksetzen</button><button class="btn ghost" onclick="check()">Reihenfolge prüfen</button>'}}
function choose(i){let p=pages[step];if(p.type==="single")selection=[i];else selection=selection.includes(i)?selection.filter(x=>x!==i):[...selection,i];p.options.forEach((_,j)=>$("c"+j).classList.toggle("selected",selection.includes(j)))}
function match(i){let p=pages[step];if(i===p.items[matchIndex][1]){matchIndex++;if(matchIndex===p.items.length){success(p.explain);return}drawMatch(p)}else feedback("Versuchen Sie es noch einmal. Überlegen Sie, woher dieser Risikofaktor stammt.",false)}
function drawMatch(p){$("matchPrompt").innerHTML='<p><strong>Merkmal '+(matchIndex+1)+' von '+p.items.length+':</strong> '+p.items[matchIndex][0]+'</p>'}
function pickOrder(i){if(order.includes(i))return;order.push(i);$("o"+i).classList.add("active");$("ordered").textContent="Ihre Reihenfolge: "+order.map((j,k)=>(k+1)+". "+pages[step].items[j]).join(" → ")}
function check(){let p=pages[step];let correct=p.type==="single"?selection.length===1&&selection[0]===p.correct:p.type==="multi"?selection.length===p.correct.length&&p.correct.every(x=>selection.includes(x)):p.type==="order"?order.length===6&&p.correct.every((x,i)=>order[i]===x):false;if(correct)success(p.explain);else feedback("Noch nicht ganz richtig. Überprüfen Sie Ihre Auswahl und versuchen Sie es erneut.",false)}
function feedback(t,ok){$("feedback").innerHTML='<div class="feedback '+(ok?"":"bad")+'">'+(ok?"✓ ":"↻ ")+t+'</div>'}
function success(t){feedback(t,true);$("next").disabled=false;$("activity").querySelectorAll("button").forEach(b=>b.disabled=true)}
function advance(){done=Math.max(done,step);go(step===7?8:step+1)}
function renderQuiz(){if(done!==7)return;$("page").innerHTML='<section class="card page"><h2>🏁 Abschlussquiz: Ihre Mission</h2><p>Beantworten Sie alle zehn Multiple-Choice-Fragen. Pro Frage ist genau eine Antwort richtig.</p><div id="quiz"></div><button class="btn" onclick="finish()">Ergebnis auswerten</button><div id="certificate"></div></section>';$("certificate").style.display="none";$("quiz").innerHTML=questions.map((q,i)=>'<div class="quizq"><strong>'+(i+1)+'. '+q[0]+'</strong>'+q[1].map((v,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+v+'</label>').join("")+'</div>').join("")}
function finish(){let score=0;for(let i=0;i<questions.length;i++){let a=document.querySelector('input[name="q'+i+'"]:checked');if(!a){alert("Bitte beantworten Sie alle zehn Fragen.");return}if(Number(a.value)===questions[i][2])score++}let c=$("certificate");c.style.display="block";c.innerHTML='<h2>🎉 Ihre Lernreise ist abgeschlossen!</h2><p style="font-size:26px"><strong>'+score+' von 10 Punkten</strong></p><p>Sie haben alle sieben Lerninseln bearbeitet.</p><p><strong>Wichtig:</strong> Machen Sie jetzt einen Screenshot dieses Ergebnisses und senden Sie ihn Ihrer Lehrkraft per E-Mail.</p><button class="btn ghost" onclick="window.print()">Ergebnis drucken</button>';document.querySelectorAll("#quiz input").forEach(x=>x.disabled=true);document.querySelector("#page>.card>.btn").disabled=true;c.scrollIntoView({behavior:"smooth"})}
render();
</script></body></html>
